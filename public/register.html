<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Meetha Tales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="fas fa-cookie-bite brand-icon"></i> Meetha Tales</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon" style="filter: invert(1);"></span></button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="/gallery">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Contact Us</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card">
    <h2><i class="fas fa-user-plus text-gold"></i> Create Account</h2>
    <p class="auth-subtitle">Join Meetha Tales for a sweeter experience</p>
    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label">Full Name *</label>
        <input type="text" class="form-control" name="full_name" required placeholder="Your full name">
      </div>
      <div class="mb-3">
        <label class="form-label">Email *</label>
        <input type="email" class="form-control" name="email" required placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Phone *</label>
        <input type="text" class="form-control" name="phone" required placeholder="9876543210">
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea class="form-control" name="address" rows="2" placeholder="Your delivery address"></textarea>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Password *</label>
          <input type="password" class="form-control" name="password" required placeholder="Min 6 characters">
        </div>
        <div class="col-md-6">
          <label class="form-label">Confirm Password *</label>
          <input type="password" class="form-control" name="confirm_password" required placeholder="Re-enter password">
        </div>
      </div>
      <button type="submit" class="btn btn-gold w-100 btn-lg mt-3"><i class="fas fa-user-plus"></i> Register</button>
    </form>
    <p class="text-center mt-3">Already have an account? <a href="/login" class="text-maroon fw-bold">Login here</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const payload = Object.fromEntries(formData);
  try {
    showLoading();
    await api('/api/auth/register', { method: 'POST', body: JSON.stringify(payload) });
    hideLoading();
    showToast('Registration successful! Please login to continue.', 'success');
    setTimeout(() => location.href = '/login', 1200);
  } catch (err) {
    hideLoading();
    showToast(err.message, 'error');
  }
});
</script>
</body>
</html>
