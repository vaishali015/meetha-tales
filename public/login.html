<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Meetha Tales</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Font Awesome -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    rel="stylesheet"
  >

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Your CSS -->
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg">

  <div class="container">

    <a class="navbar-brand" href="/">
      <i class="fas fa-cookie-bite brand-icon"></i>
      Meetha Tales
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navMain"
    >
      <span
        class="navbar-toggler-icon"
        style="filter: invert(1);"
      ></span>
    </button>

    <div class="collapse navbar-collapse" id="navMain">

      <ul class="navbar-nav me-auto">

        <li class="nav-item">
          <a class="nav-link" href="/">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/about">About Us</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/products">Products</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/gallery">Gallery</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/contact">Contact Us</a>
        </li>

      </ul>

    </div>

  </div>

</nav>


<!-- ================= LOGIN ================= -->

<div class="auth-wrapper">

  <div class="auth-card">

    <h2>
      <i class="fas fa-sign-in-alt text-gold"></i>
      Welcome Back
    </h2>

    <p class="auth-subtitle">
      Login to your Meetha Tales account
    </p>


    <!-- Login Form -->

    <form id="loginForm">

      <!-- Email -->

      <div class="mb-3">

        <label class="form-label">
          Email Address
        </label>

        <input
          type="email"
          class="form-control"
          name="email"
          id="email"
          required
          placeholder="you@example.com"
        >

      </div>


      <!-- Password -->

      <div class="mb-3">

        <label class="form-label">
          Password
        </label>

        <input
          type="password"
          class="form-control"
          name="password"
          id="password"
          required
          placeholder="Enter your password"
        >

      </div>


      <!-- Remember + Forgot Password -->

      <div class="d-flex justify-content-between mb-3">

        <div class="form-check">

          <input
            class="form-check-input"
            type="checkbox"
            name="remember"
            id="remember"
          >

          <label
            class="form-check-label"
            for="remember"
          >
            Remember me
          </label>

        </div>


        <a
          href="#"
          data-bs-toggle="modal"
          data-bs-target="#forgotModal"
          class="text-maroon"
        >
          Forgot Password?
        </a>

      </div>


      <!-- Login Button -->

      <button
        type="submit"
        class="btn btn-gold w-100 btn-lg"
      >
        <i class="fas fa-sign-in-alt"></i>
        Login
      </button>

    </form>


    <!-- Register -->

    <p class="text-center mt-3">

      Don't have an account?

      <a
        href="/register"
        class="text-maroon fw-bold"
      >
        Register here
      </a>

    </p>


    <hr>


    <!-- Admin Login -->

    <p class="text-center">

      <a
        href="/admin"
        class="text-muted"
      >

        <i class="fas fa-user-shield"></i>
        Admin Login

      </a>

    </p>

  </div>

</div>



<!-- ================= FORGOT PASSWORD MODAL ================= -->

<div
  class="modal fade"
  id="forgotModal"
  tabindex="-1"
  aria-hidden="true"
>

  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title">
          Forgot Password
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>

      </div>


      <div class="modal-body">

        <p>
          Enter your email and we'll send you a reset link.
        </p>

        <input
          type="email"
          id="forgotEmail"
          class="form-control mb-3"
          placeholder="your email address"
        >


        <button
          class="btn btn-gold w-100"
          onclick="sendResetLink()"
        >
          Send Reset Link
        </button>

      </div>

    </div>

  </div>

</div>



<!-- ================= JAVASCRIPT ================= -->

<!-- Bootstrap JS -->

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
></script>


<!-- Your main app.js -->

<script src="/js/app.js"></script>


<script>

  // ============================================
  // CLOSE MODAL
  // ============================================

  function closeModal(id) {

    const modalElement = document.getElementById(id);

    const modal =
      bootstrap.Modal.getInstance(modalElement);

    if (modal) {
      modal.hide();
    }

  }


  // ============================================
  // FORGOT PASSWORD
  // ============================================

  function sendResetLink() {

    const email =
      document.getElementById('forgotEmail').value.trim();

    if (!email) {

      showToast(
        'Please enter your email address.',
        'error'
      );

      return;

    }

    showToast(
      'Password reset link sent (demo).',
      'info'
    );

    closeModal('forgotModal');

  }


  // ============================================
  // CUSTOMER LOGIN
  // ============================================

  document
    .getElementById('loginForm')
    .addEventListener('submit', async function (e) {

      e.preventDefault();


      // Get form values

      const email =
        document.getElementById('email').value.trim();

      const password =
        document.getElementById('password').value;

      const remember =
        document.getElementById('remember').checked;


      // Prepare login data

      const payload = {
        email: email,
        password: password,
        remember: remember
      };


      try {

        // Show loading

        showLoading();


        // Send login request to backend

        const data = await api(
          '/api/auth/login',
          {
            method: 'POST',

            headers: {
              'Content-Type': 'application/json'
            },

            body: JSON.stringify(payload)
          }
        );


        // Save customer login information

        localStorage.setItem(
          'token',
          data.token
        );

        localStorage.setItem(
          'customer',
          JSON.stringify(data.customer)
        );


        // Hide loading

        hideLoading();


        // Success message

        showToast(
          'Login successful! Welcome back.',
          'success'
        );


        // ========================================
        // REDIRECT TO EXISTING CUSTOMER DASHBOARD
        // ========================================

        setTimeout(() => {

          window.location.href =
            '/customer-dashboard.html';

        }, 800);


      } catch (err) {

        // Hide loading

        hideLoading();


        // Show error

        showToast(
          err.message || 'Login failed. Please try again.',
          'error'
        );

      }

    });

</script>

</body>
</html>
