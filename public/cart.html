<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Meetha Tales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="fas fa-cookie-bite brand-icon"></i> Meetha Tales</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon" style="filter: invert(1);"></span></button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
        <li class="nav-item"><a class="nav-link active" href="/products">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="/gallery">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Contact Us</a></li>
      </ul>
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item" id="navCartLink" style="display:none;"><a class="nav-link cart-badge" href="/cart"><i class="fas fa-shopping-cart"></i><span class="badge-count" id="cartCount">0</span></a></li>
        <li class="nav-item" id="navOrdersLink" style="display:none;"><a class="nav-link" href="/orders"><i class="fas fa-receipt"></i> Orders</a></li>
        <li class="nav-item" id="navLoginLink"><a class="nav-link" href="/login"><i class="fas fa-sign-in-alt"></i> Login</a></li>
        <li class="nav-item" id="navLogoutLink" style="display:none;"><a class="nav-link" href="javascript:void(0)" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <h2 class="text-maroon mb-4"><i class="fas fa-shopping-cart"></i> Your Shopping Cart</h2>
  <div class="row" id="cartContainer">
    <div class="col-12 text-center"><div class="loading-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
  </div>
</div>

<footer class="footer">
  <div class="container"><div class="footer-bottom"><p>&copy; 2024 Meetha Tales. All rights reserved.</p></div></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
async function loadCart() {
  if (!isLoggedIn()) {
    document.getElementById('cartContainer').innerHTML = `
      <div class="col-12"><div class="empty-state">
        <i class="fas fa-shopping-cart icon"></i>
        <h4>Please login to view your cart</h4>
        <a href="/login" class="btn btn-gold mt-3">Login</a>
      </div></div>`;
    return;
  }
  try {
    const data = await api('/api/cart');
    const container = document.getElementById('cartContainer');
    if (!data.items || data.items.length === 0) {
      container.innerHTML = `
        <div class="col-12"><div class="empty-state">
          <i class="fas fa-cart-arrow-down icon"></i>
          <h4>Your cart is empty</h4>
          <p>Add some delicious sweets to your cart!</p>
          <a href="/products" class="btn btn-gold mt-3">Browse Products</a>
        </div></div>`;
      return;
    }
    const itemsHtml = data.items.map(item => `
      <div class="cart-item p-3 mb-3 d-flex align-items-center gap-3 flex-wrap">
        <img src="${getProductImageUrl(item.image)}" width="80" height="80" style="object-fit:cover;border-radius:8px;" onerror="this.src='${PRODUCT_IMAGES['default.jpg']}'">
        <div class="flex-grow-1">
          <h6 class="text-maroon mb-0">${item.name}</h6>
          <small class="text-muted">&#8377;${parseFloat(item.price).toFixed(0)} / ${item.unit}</small>
          ${item.status !== 'active' ? '<div><span class="stock-badge stock-out">Unavailable</span></div>' : ''}
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="qty-btn" onclick="updateQty(${item.id}, ${item.quantity - 1})"><i class="fas fa-minus"></i></button>
          <span class="fw-bold mx-2" id="qty_${item.id}">${item.quantity}</span>
          <button class="qty-btn" onclick="updateQty(${item.id}, ${item.quantity + 1})" ${item.quantity >= item.stock ? 'disabled' : ''}><i class="fas fa-plus"></i></button>
        </div>
        <div class="fw-bold text-maroon">&#8377;${(parseFloat(item.price) * item.quantity).toFixed(0)}</div>
        <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${item.id})"><i class="fas fa-trash"></i></button>
      </div>
    `).join('');

    container.innerHTML = `
      <div class="col-lg-8">${itemsHtml}
        <button class="btn btn-outline-danger mt-2" onclick="clearCartItems()"><i class="fas fa-trash"></i> Clear Cart</button>
      </div>
      <div class="col-lg-4">
        <div class="cart-summary">
          <h5 class="text-maroon mb-3">Order Summary</h5>
          <div class="summary-row"><span>Items:</span><span>${data.items.length}</span></div>
          <div class="summary-row"><span>Subtotal:</span><span>&#8377;${data.subtotal.toFixed(0)}</span></div>
          <div class="summary-row"><span>Delivery:</span><span class="text-success">Free</span></div>
          <div class="summary-row total-row"><span>Total:</span><span>&#8377;${data.total.toFixed(0)}</span></div>
          <a href="/checkout" class="btn btn-gold w-100 btn-lg mt-3"><i class="fas fa-check-circle"></i> Checkout</a>
          <a href="/products" class="btn btn-outline-gold w-100 mt-2">Continue Shopping</a>
        </div>
      </div>
    `;
  } catch (err) {
    document.getElementById('cartContainer').innerHTML = `<div class="col-12"><div class="empty-state"><i class="fas fa-exclamation-circle icon"></i><p>${err.message}</p></div></div>`;
  }
}

async function updateQty(itemId, newQty) {
  if (newQty < 1) { removeItem(itemId); return; }
  try {
    await api('/api/cart/' + itemId, { method: 'PUT', body: JSON.stringify({ quantity: newQty }) });
    loadCart();
    updateCartCount();
  } catch (err) { showToast(err.message, 'error'); }
}

async function removeItem(itemId) {
  try {
    await api('/api/cart/' + itemId, { method: 'DELETE' });
    showToast('Item removed from cart.', 'success');
    loadCart();
    updateCartCount();
  } catch (err) { showToast(err.message, 'error'); }
}

async function clearCartItems() {
  if (!confirm('Clear all items from cart?')) return;
  try {
    await api('/api/cart', { method: 'DELETE' });
    showToast('Cart cleared.', 'success');
    loadCart();
    updateCartCount();
  } catch (err) { showToast(err.message, 'error'); }
}

loadCart();
</script>
</body>
</html>
