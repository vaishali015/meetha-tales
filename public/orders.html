<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Meetha Tales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="fas fa-cookie-bite brand-icon"></i> Meetha Tales</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon" style="filter: invert(1);"></span></button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="/gallery">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Contact Us</a></li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item" id="navCartLink" style="display:none;"><a class="nav-link cart-badge" href="/cart"><i class="fas fa-shopping-cart"></i><span class="badge-count" id="cartCount">0</span></a></li>
        <li class="nav-item active"><a class="nav-link" href="/orders"><i class="fas fa-receipt"></i> Orders</a></li>
        <li class="nav-item" id="navLogoutLink" style="display:none;"><a class="nav-link" href="javascript:void(0)" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <h2 class="text-maroon mb-4"><i class="fas fa-receipt"></i> My Orders</h2>
  <div id="ordersContainer">
    <div class="text-center"><div class="loading-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
  </div>
</div>

<!-- Order Details Modal -->
<div class="modal fade" id="orderModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Order Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="orderModalBody"></div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container"><div class="footer-bottom"><p>&copy; 2024 Meetha Tales. All rights reserved.</p></div></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
const statusColors = { pending:'status-pending', confirmed:'status-confirmed', preparing:'status-preparing', ready:'status-ready', delivered:'status-delivered', cancelled:'status-cancelled' };

async function loadOrders() {
  if (!isLoggedIn()) { location.href = '/login'; return; }
  try {
    const data = await api('/api/orders');
    const container = document.getElementById('ordersContainer');
    if (!data.orders || data.orders.length === 0) {
      container.innerHTML = `<div class="empty-state"><i class="fas fa-receipt icon"></i><h4>No orders yet</h4><p>You haven't placed any orders. Start shopping!</p><a href="/products" class="btn btn-gold mt-3">Browse Products</a></div>`;
      return;
    }
    container.innerHTML = `<div class="table-responsive admin-table"><table class="table">
      <thead><tr><th>Order #</th><th>Date</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead>
      <tbody>${data.orders.map(o => `
        <tr>
          <td><strong>#${o.id}</strong></td>
          <td>${new Date(o.order_date).toLocaleDateString()}</td>
          <td>Rs. ${parseFloat(o.total_amount).toFixed(0)}</td>
          <td>${o.payment_method.toUpperCase()}</td>
          <td><span class="status-badge ${statusColors[o.order_status] || ''}">${o.order_status}</span></td>
          <td><button class="btn btn-sm btn-outline-gold" onclick="viewOrder(${o.id})"><i class="fas fa-eye"></i> View</button></td>
        </tr>
      `).join('')}</tbody>
    </table></div>`;
  } catch (err) {
    document.getElementById('ordersContainer').innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle icon"></i><p>${err.message}</p></div>`;
  }
}

async function viewOrder(id) {
  try {
    const data = await api('/api/orders/' + id);
    const o = data.order;
    const body = document.getElementById('orderModalBody');
    body.innerHTML = `
      <div class="row mb-3">
        <div class="col-md-6"><p><strong>Order #:</strong> ${o.id}</p><p><strong>Date:</strong> ${new Date(o.order_date).toLocaleString()}</p></div>
        <div class="col-md-6"><p><strong>Status:</strong> <span class="status-badge ${statusColors[o.order_status] || ''}">${o.order_status}</span></p><p><strong>Payment:</strong> ${o.payment_method.toUpperCase()} (${o.payment_status})</p></div>
      </div>
      <p><strong>Delivery Address:</strong> ${o.delivery_address || 'N/A'}</p>
      <hr>
      <h6>Order Items</h6>
      <table class="table table-sm">
        <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr></thead>
        <tbody>${data.items.map(i => `
          <tr><td>${i.product_name || 'N/A'}</td><td>${i.quantity}</td><td>Rs. ${parseFloat(i.price).toFixed(0)}</td><td>Rs. ${parseFloat(i.subtotal).toFixed(0)}</td></tr>
        `).join('')}</tbody>
      </table>
      <div class="text-end"><h5 class="text-maroon">Total: Rs. ${parseFloat(o.total_amount).toFixed(0)}</h5></div>
    `;
    new bootstrap.Modal(document.getElementById('orderModal')).show();
  } catch (err) { showToast(err.message, 'error'); }
}

loadOrders();
</script>
</body>
</html>
