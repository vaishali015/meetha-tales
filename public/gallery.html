<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Meetha Tales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="fas fa-cookie-bite brand-icon"></i> Meetha Tales</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon" style="filter: invert(1);"></span></button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
        <li class="nav-item"><a class="nav-link active" href="/gallery">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Contact Us</a></li>
      </ul>
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item" id="navCartLink" style="display:none;"><a class="nav-link cart-badge" href="/cart"><i class="fas fa-shopping-cart"></i><span class="badge-count" id="cartCount">0</span></a></li>
        <li class="nav-item" id="navOrdersLink" style="display:none;"><a class="nav-link" href="/orders"><i class="fas fa-receipt"></i> Orders</a></li>
        <li class="nav-item" id="navLoginLink"><a class="nav-link" href="/login"><i class="fas fa-sign-in-alt"></i> Login</a></li>
        <li class="nav-item" id="navLogoutLink" style="display:none;"><a class="nav-link" href="javascript:void(0)" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        <li class="nav-item"><a class="nav-link" href="/register"><i class="fas fa-user-plus"></i> Register</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="section-title">
    <h2>Our Gallery</h2>
    <div class="underline"></div>
    <p>A glimpse into the world of Meetha Tales - our sweets, shop, and celebrations</p>
  </div>

  <div class="text-center mb-4">
    <div class="btn-group" role="group">
      <button class="btn btn-outline-gold active" onclick="filterGallery('all', this)">All</button>
      <button class="btn btn-outline-gold" onclick="filterGallery('sweets', this)">Sweets</button>
      <button class="btn btn-outline-gold" onclick="filterGallery('festivals', this)">Festivals</button>
      <button class="btn btn-outline-gold" onclick="filterGallery('gift', this)">Gift Hampers</button>
      <button class="btn btn-outline-gold" onclick="filterGallery('shop', this)">Shop</button>
    </div>
  </div>

  <div class="row g-3" id="galleryGrid">
    <div class="col-12 text-center"><div class="loading-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
  </div>
</div>

<!-- Image Modal -->
<div class="modal fade" id="galleryModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="galleryModalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <img id="galleryModalImg" src="" class="img-fluid rounded" alt="">
        <p class="mt-3 text-muted" id="galleryModalDesc"></p>
      </div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container"><div class="footer-bottom"><p>&copy; 2024 Meetha Tales. All rights reserved.</p></div></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
let allGallery = [];

async function loadGallery() {
  try {
    const data = await api('/api/gallery');
    allGallery = data.gallery || [];
    renderGallery(allGallery);
  } catch (err) {
    document.getElementById('galleryGrid').innerHTML = `<div class="col-12"><div class="empty-state"><i class="fas fa-exclamation-circle icon"></i><p>${err.message}</p></div></div>`;
  }
}

function renderGallery(items) {
  const container = document.getElementById('galleryGrid');
  if (items.length === 0) {
    container.innerHTML = '<div class="col-12"><div class="empty-state"><i class="fas fa-images icon"></i><p>No images in this category.</p></div></div>';
    return;
  }
  container.innerHTML = items.map(g => `
    <div class="col-md-6 col-lg-4 col-sm-6">
      <div class="gallery-item" onclick="openGallery('${getGalleryImageUrl(g.image)}', '${g.title.replace(/'/g, "")}', '${(g.description||'').replace(/'/g, "")}')">
        <img src="${getGalleryImageUrl(g.image)}" alt="${g.title}" onerror="this.src='${GALLERY_IMAGES['gallery-1.jpg']}'">
        <div class="overlay"><h5>${g.title}</h5></div>
      </div>
    </div>
  `).join('');
}

function filterGallery(category, btn) {
  document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (category === 'all') {
    renderGallery(allGallery);
  } else {
    renderGallery(allGallery.filter(g => g.category === category));
  }
}

function openGallery(img, title, desc) {
  document.getElementById('galleryModalImg').src = img;
  document.getElementById('galleryModalTitle').textContent = title;
  document.getElementById('galleryModalDesc').textContent = desc;
  new bootstrap.Modal(document.getElementById('galleryModal')).show();
}

loadGallery();
</script>
</body>
</html>
